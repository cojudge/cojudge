name: Release desktop installers
run-name: Release Cojudge v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from package.json, without the leading v
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const requested = process.env.VERSION;
          const packageVersion = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const cargo = readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoVersion = cargo.match(/^\[package\][\s\S]*?^version\s*=\s*"([^"]+)"/m)?.[1];

          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(requested)) {
            throw new Error(`Invalid release version: ${requested}`);
          }
          if (requested !== packageVersion || requested !== cargoVersion) {
            throw new Error(
              `Version mismatch: input=${requested}, package.json=${packageVersion}, Cargo.toml=${cargoVersion}`
            );
          }
          NODE

      - name: Ensure release does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos
            os: macos-14
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            # NOTE: `app` must be included alongside `dmg` — the bundler only
            # creates signed updater artifacts (.app.tar.gz + .sig) for the
            # updater-enabled targets (app, appimage, msi, nsis). With `dmg`
            # alone it warns "no updater-enabled targets were built" and skips them.
            bundles: dmg,app
            artifact: src-tauri/target/universal-apple-darwin/release/bundle/dmg/Cojudge_${{ inputs.version }}_universal.dmg
          - id: windows
            os: windows-2022
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Cojudge_${{ inputs.version }}_x64-setup.exe
          - id: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: deb
            artifact: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/Cojudge_${{ inputs.version }}_amd64.deb
          - id: linux-rpm
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: rpm
            artifact: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/Cojudge-${{ inputs.version }}-1.x86_64.rpm
          - id: linux-appimage
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: appimage
            artifact: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/Cojudge_${{ inputs.version }}_amd64.AppImage

    runs-on: ${{ matrix.os }}
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      VITE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
      GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
      GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install AppImage build dependencies
        if: matrix.bundles == 'appimage'
        run: sudo apt-get install -y libfuse2 squashfs-tools

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install dependencies
        run: npm ci

      - name: Verify Firebase release configuration
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const required = [
            'VITE_FIREBASE_API_KEY',
            'VITE_FIREBASE_AUTH_DOMAIN',
            'VITE_FIREBASE_PROJECT_ID',
            'VITE_FIREBASE_MESSAGING_SENDER_ID',
            'VITE_FIREBASE_APP_ID',
            'VITE_GOOGLE_WEB_CLIENT_ID',
            'VITE_GOOGLE_DESKTOP_CLIENT_ID',
            'GOOGLE_DESKTOP_CLIENT_ID',
            'GOOGLE_DESKTOP_CLIENT_SECRET'
          ];
          const missing = required.filter((name) => !process.env[name]?.trim());
          if (missing.length) throw new Error(`Missing GitHub Actions secrets for ${missing.join(', ')}`);
          const padded = required.filter((name) => process.env[name] !== process.env[name].trim());
          if (padded.length) throw new Error(`GitHub Actions secrets contain whitespace: ${padded.join(', ')}`);
          if (!/^AIza[0-9A-Za-z_-]{30,}$/.test(process.env.VITE_FIREBASE_API_KEY)) {
            throw new Error('VITE_FIREBASE_API_KEY is invalid');
          }
          if (!/^[a-z0-9.-]+$/i.test(process.env.VITE_FIREBASE_AUTH_DOMAIN)) {
            throw new Error('VITE_FIREBASE_AUTH_DOMAIN must be a hostname');
          }
          if (!/^[a-z][a-z0-9-]{4,28}[a-z0-9]$/.test(process.env.VITE_FIREBASE_PROJECT_ID)) {
            throw new Error('VITE_FIREBASE_PROJECT_ID is invalid');
          }
          if (!/^\d+$/.test(process.env.VITE_FIREBASE_MESSAGING_SENDER_ID)) {
            throw new Error('VITE_FIREBASE_MESSAGING_SENDER_ID is invalid');
          }
          if (!/^1:\d+:web:[0-9a-z]+$/i.test(process.env.VITE_FIREBASE_APP_ID)) {
            throw new Error('VITE_FIREBASE_APP_ID is invalid');
          }
          if (!/^\d+-[a-z0-9-]+\.apps\.googleusercontent\.com$/i.test(process.env.VITE_GOOGLE_DESKTOP_CLIENT_ID)) {
            throw new Error('VITE_GOOGLE_DESKTOP_CLIENT_ID is invalid');
          }
          if (!/^\d+-[a-z0-9-]+\.apps\.googleusercontent\.com$/i.test(process.env.VITE_GOOGLE_WEB_CLIENT_ID)) {
            throw new Error('VITE_GOOGLE_WEB_CLIENT_ID is invalid');
          }
          if (!process.env.VITE_GOOGLE_WEB_CLIENT_ID.startsWith(`${process.env.VITE_FIREBASE_MESSAGING_SENDER_ID}-`)) {
            throw new Error('Google web client ID must belong to the Firebase project');
          }
          if (!process.env.VITE_GOOGLE_DESKTOP_CLIENT_ID.startsWith(`${process.env.VITE_FIREBASE_MESSAGING_SENDER_ID}-`)) {
            throw new Error('Google desktop client ID must belong to the Firebase project');
          }
          if (process.env.GOOGLE_DESKTOP_CLIENT_ID !== process.env.VITE_GOOGLE_DESKTOP_CLIENT_ID) {
            throw new Error('Native and frontend Google desktop client IDs must match');
          }
          if (process.env.GOOGLE_DESKTOP_CLIENT_SECRET.length > 512 || /\s/.test(process.env.GOOGLE_DESKTOP_CLIENT_SECRET)) {
            throw new Error('Google desktop client secret is invalid');
          }
          NODE

      - name: Configure ad-hoc macOS signing
        if: runner.os == 'macOS'
        shell: bash
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"

      - name: Build installer
        env:
          COJUDGE_DESKTOP_TARGET: ${{ matrix.target }}
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: List bundle outputs (debug updater artifacts)
        shell: bash
        run: |
          echo "=== bundle outputs for ${{ matrix.id }} ==="
          find src-tauri/target -path "*bundle*" \( -name "*.sig" -o -name "*.tar.gz" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.dmg" -o -name "*.exe" -o -name "*.zip" \) -type f 2>/dev/null | sort || true

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.id }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-updater-${{ matrix.id }}
          path: |
            src-tauri/target/**/bundle/**/*.sig
            src-tauri/target/**/bundle/**/*.tar.gz
            src-tauri/target/**/bundle/**/*.AppImage
            src-tauri/target/**/bundle/nsis/*setup.exe
            src-tauri/target/**/bundle/nsis/*.nsis.zip
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      # upload-artifact preserves each file's relative path, so updater bundles
      # land in nested dirs (e.g. release/universal-apple-darwin/release/bundle/macos/
      # Cojudge.app.tar.gz). Flatten everything to release/ so verification,
      # latest.json generation, and `gh release create release/*` all see them.
      - name: Flatten downloaded artifacts
        run: |
          find release -mindepth 2 -type f -exec mv -n {} release/ \;
          find release -mindepth 1 -type d -empty -delete
          echo "=== release/ ==="
          ls -la release/

      - name: Verify release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, statSync } from 'node:fs';

          const version = process.env.VERSION;
          const expectedInstallers = [
            `Cojudge-${version}-1.x86_64.rpm`,
            `Cojudge_${version}_amd64.AppImage`,
            `Cojudge_${version}_amd64.deb`,
            `Cojudge_${version}_universal.dmg`,
            `Cojudge_${version}_x64-setup.exe`
          ];
          const files = readdirSync('release', { withFileTypes: true })
            .filter((entry) => entry.isFile())
            .map((entry) => entry.name);

          for (const name of expectedInstallers) {
            if (!files.includes(name)) throw new Error(`Missing installer: ${name} (found: ${JSON.stringify(files)})`);
            if (statSync(`release/${name}`).size === 0) throw new Error(`${name} is empty`);
          }
          // Updater bundles + signatures must exist for win/mac/linux auto-update.
          const hasMacTarGz = files.some((n) => n.endsWith('.app.tar.gz'));
          const hasMacSig = files.some((n) => n.endsWith('.app.tar.gz.sig'));
          const hasWinBundle = files.some((n) => n.endsWith('-setup.exe') || n.endsWith('.nsis.zip'));
          const hasWinSig = files.some((n) => n.endsWith('-setup.exe.sig') || n.endsWith('.nsis.zip.sig'));
          const hasLinuxAppImage = files.some((n) => n.endsWith('.AppImage') && !n.endsWith('.sig'));
          const hasLinuxSig = files.some((n) => n.endsWith('.AppImage.sig'));
          if (!hasMacTarGz || !hasMacSig) throw new Error(`Missing macOS updater bundle/sig: ${JSON.stringify(files)}`);
          if (!hasWinBundle || !hasWinSig) throw new Error(`Missing Windows updater bundle/sig: ${JSON.stringify(files)}`);
          if (!hasLinuxAppImage || !hasLinuxSig) throw new Error(`Missing Linux AppImage updater bundle/sig: ${JSON.stringify(files)}`);
          NODE

      - name: Generate latest.json for Tauri updater
        env:
          VERSION: ${{ inputs.version }}
          TAG: v${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync, writeFileSync, statSync } from 'node:fs';

          const version = process.env.VERSION;
          const tag = process.env.TAG;
          const repo = process.env.REPO;
          const base = `https://github.com/${repo}/releases/download/${tag}`;
          const files = readdirSync('release', { withFileTypes: true })
            .filter((e) => e.isFile())
            .map((e) => e.name);

          function pick(patterns) {
            for (const pat of patterns) {
              const found = typeof pat === 'string' ? (files.includes(pat) ? pat : null) : files.find((n) => pat.test(n)) ?? null;
              if (found) return found;
            }
            return null;
          }

          // macOS universal updater bundle (same file serves both archs)
          const macBundle = pick([/\.app\.tar\.gz$/]);
          // Windows: prefer nsis.zip (classic updater bundle), else setup.exe (supported since updater 2.10)
          const winBundle = pick([/\.nsis\.zip$/, /-setup\.exe$/]);
          // Linux: AppImage is the auto-updatable bundle (deb/rpm need manual reinstall)
          const linuxBundle = pick([/\.AppImage$/]);

          if (!macBundle) throw new Error(`macOS updater bundle not found in ${JSON.stringify(files)}`);
          if (!winBundle) throw new Error(`Windows updater bundle not found in ${JSON.stringify(files)}`);
          if (!linuxBundle) throw new Error(`Linux AppImage updater bundle not found in ${JSON.stringify(files)}`);

          function sigFor(bundle) {
            const sig = `${bundle}.sig`;
            if (!files.includes(sig)) throw new Error(`Missing signature ${sig}`);
            const content = readFileSync(`release/${sig}`, 'utf8').trim();
            if (!content) throw new Error(`Signature ${sig} is empty`);
            return content;
          }

          const manifest = {
            version,
            pub_date: new Date().toISOString(),
            platforms: {
              'darwin-aarch64': { signature: sigFor(macBundle), url: `${base}/${macBundle}` },
              'darwin-x86_64': { signature: sigFor(macBundle), url: `${base}/${macBundle}` },
              'linux-x86_64': { signature: sigFor(linuxBundle), url: `${base}/${linuxBundle}` },
              'windows-x86_64': { signature: sigFor(winBundle), url: `${base}/${winBundle}` }
            }
          };
          for (const [platform, entry] of Object.entries(manifest.platforms)) {
            const filename = entry.url.split('/').pop();
            if (statSync(`release/${filename}`).size === 0) throw new Error(`Updater bundle for ${platform} is empty`);
          }
          writeFileSync('release/latest.json', JSON.stringify(manifest, null, 2) + '\n');
          console.log('Wrote release/latest.json:');
          console.log(JSON.stringify(manifest, null, 2));
          NODE

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ inputs.version }}
          RELEASE_NOTES: |
            ## Automatic updates

            Cojudge checks `github.com/cojudge/cojudge/releases` for new versions automatically on startup (desktop only).
            Use the menu → **Check for Updates** button (under Light/Dark theme) to check manually, install in-app, and restart to apply.

            - macOS (universal `.dmg` / `.app.tar.gz`): in-app install supported when launched from `/Applications`.
            - Windows (`-setup.exe`): in-app install supported; the installer restarts the app automatically.
            - Linux: in-app install supported for the `.AppImage`. If you installed via `.deb`/`.rpm`, download the new package manually.

            ## Manage Problems

            You can add or edit problems without having to clone the repo, modify files and build a new binary!
            All you need is to go to `~/cojudge` to add or edit files there:

            - `/problems/[slug]` for adding new problems. You can also view or edit existing problems
            - `/courses/[id]/courseinfo.json` for adding new course. You can also view or edit existing courses

            Optional: You can install the `cojudge` desktop CLI via GUI to verify your new problems programmatically after adding them.

            View `~/cojudge/README.md` for a more detailed guide.

            ## Linux installation (x86_64)

            Ubuntu, Debian, and Pop!_OS: download the `.deb` and install it with:

            ```bash
            sudo apt install ./Cojudge_${{ inputs.version }}_amd64.deb
            ```

            Fedora: download the `.rpm` and install it with:

            ```bash
            sudo dnf install ./Cojudge-${{ inputs.version }}-1.x86_64.rpm
            ```

            Arch Linux and other compatible Linux distributions: download the `.AppImage`, make it executable, and run it:

            ```bash
            chmod +x Cojudge_${{ inputs.version }}_amd64.AppImage
            ./Cojudge_${{ inputs.version }}_amd64.AppImage
            ```

            If the AppImage reports a missing `libfuse.so.2` on Arch, install `fuse2` with `sudo pacman -S fuse2`.

            ## macOS installation

            The macOS application is ad-hoc signed and is not notarized. After dragging `Cojudge.app` into `/Applications`, this command is required before the first launch:

            ```bash
            xattr -dr com.apple.quarantine /Applications/Cojudge.app
            ```
        run: |
          release_args=()
          if [[ "$TAG" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "Cojudge $TAG" \
            --generate-notes \
            --notes "$RELEASE_NOTES" \
            "${release_args[@]}"

  winget:
    needs: publish
    if: ${{ !contains(inputs.version, '-') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Cojudge.Cojudge
          installers-regex: 'x64-setup\.exe$'
          release-tag: v${{ inputs.version }}
          fork-user: anslwy
          token: ${{ secrets.WINGET_TOKEN }}
