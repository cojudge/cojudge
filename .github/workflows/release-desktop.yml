name: Release desktop installers
run-name: Release Cojudge v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from package.json, without the leading v
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const requested = process.env.VERSION;
          const packageVersion = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const cargo = readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoVersion = cargo.match(/^\[package\][\s\S]*?^version\s*=\s*"([^"]+)"/m)?.[1];

          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(requested)) {
            throw new Error(`Invalid release version: ${requested}`);
          }
          if (requested !== packageVersion || requested !== cargoVersion) {
            throw new Error(
              `Version mismatch: input=${requested}, package.json=${packageVersion}, Cargo.toml=${cargoVersion}`
            );
          }
          NODE

      - name: Ensure release does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos
            os: macos-14
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg
            artifact: src-tauri/target/universal-apple-darwin/release/bundle/dmg/Cojudge_${{ inputs.version }}_universal.dmg
          - id: windows
            os: windows-2022
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Cojudge_${{ inputs.version }}_x64-setup.exe
          - id: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: deb
            artifact: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/Cojudge_${{ inputs.version }}_amd64.deb

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install dependencies
        run: npm ci

      - name: Configure ad-hoc macOS signing
        if: runner.os == 'macOS'
        shell: bash
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"

      - name: Build installer
        env:
          COJUDGE_DESKTOP_TARGET: ${{ matrix.target }}
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.id }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - name: Verify release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, statSync } from 'node:fs';

          const version = process.env.VERSION;
          const expected = [
            `Cojudge_${version}_amd64.deb`,
            `Cojudge_${version}_universal.dmg`,
            `Cojudge_${version}_x64-setup.exe`
          ].sort();
          const actual = readdirSync('release', { withFileTypes: true })
            .filter((entry) => entry.isFile())
            .map((entry) => entry.name)
            .sort();

          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Unexpected release assets: ${JSON.stringify(actual)}`);
          }
          for (const name of actual) {
            if (statSync(`release/${name}`).size === 0) throw new Error(`${name} is empty`);
          }
          NODE

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ inputs.version }}
          MACOS_INSTALL_NOTE: |
            ## macOS installation

            The macOS application is ad-hoc signed and is not notarized. After dragging `Cojudge.app` into `/Applications`, this command is required before the first launch:

            ```bash
            xattr -dr com.apple.quarantine /Applications/Cojudge.app
            ```
        run: |
          release_args=()
          if [[ "$TAG" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "Cojudge $TAG" \
            --generate-notes \
            --notes "$MACOS_INSTALL_NOTE" \
            "${release_args[@]}"
