name: Verify winget listing (one-off)
run-name: Verify winget for Cojudge.Cojudge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: winget version
        run: winget --version

      - name: Search index
        run: winget search Cojudge.Cojudge --accept-source-agreements

      - name: Show package details
        run: winget show -e --id Cojudge.Cojudge --accept-source-agreements

      - name: Install via winget (what users would run)
        run: winget install -e --id Cojudge.Cojudge --silent --disable-interactivity --accept-package-agreements --accept-source-agreements

      - name: Confirm installed version
        run: |
          winget list Cojudge.Cojudge --accept-source-agreements
          if (Test-Path "$env:LocalAppData\Cojudge") { echo "Install dir present: $env:LocalAppData\Cojudge" } else { echo "Install dir MISSING"; exit 1 }
