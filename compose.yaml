name: cojudge-local

services:
  cojudge:
    image: cojudge:local
    build:
      context: .
    ports:
      - "5375:3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      COJUDGE_CONTENT_DIR: /data
      IS_DEMO_SITE: "false"
      COJUDGE_PYTHON_IMAGE: "${COJUDGE_PYTHON_IMAGE:-python:3.11-slim}"
      COJUDGE_JAVA_IMAGE: "${COJUDGE_JAVA_IMAGE:-alpine/java:22-jdk}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - cojudge-content:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  cojudge-content:
