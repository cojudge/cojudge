<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Cojudge could not start</title>
		<style>
			:root {
				color: #202124;
				background: #f7f6f2;
				font-family: -apple-system, BlinkMacSystemFont, sans-serif;
			}
			body {
				display: grid;
				min-height: 100vh;
				margin: 0;
				place-items: center;
			}
			main {
				max-width: 430px;
				padding: 40px;
			}
			h1 {
				margin: 0 0 14px;
				font-size: 24px;
			}
			p {
				margin: 0;
				color: #5f6368;
				font-size: 15px;
				line-height: 1.55;
			}
			code {
				color: #303134;
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					color: #f1f3f4;
					background: #202124;
				}
				p,
				code {
					color: #bdc1c6;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Cojudge could not start</h1>
			<p>
				Close any process using <code>cojudge.localhost:5376</code>, then reopen Cojudge. If
				the problem continues, check the macOS Console for backend errors.
			</p>
		</main>
	</body>
</html>
